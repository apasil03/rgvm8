name: Daily Instagram post

on:
  schedule:
    # 15:00 UTC (~8am PT / 11am ET) daily
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Pick next post + generate image if needed
        id: prepare
        run: python scripts/prepare_post.py

      - name: Commit prepared image/queue state
        if: steps.prepare.outputs.row_id != ''
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pending content/queue.csv
          git diff --cached --quiet || git commit -m "Prepare post ${{ steps.prepare.outputs.row_id }} [skip ci]"
          git push

      # Deploy Pages here (not just via publish-pages.yml) so the image is
      # guaranteed live before we ask the Graph API to fetch it.
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.row_id != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.row_id != ''
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.prepare.outputs.row_id != ''

      - name: Publish to Instagram
        if: steps.prepare.outputs.row_id != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          ROW_ID: ${{ steps.prepare.outputs.row_id }}
        run: python scripts/publish_post.py

      - name: Commit published state
        if: steps.prepare.outputs.row_id != ''
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.csv
          git diff --cached --quiet || git commit -m "Mark post ${{ steps.prepare.outputs.row_id }} published [skip ci]"
          git pull --rebase
          git push
