name: Daily Instagram post

on:
  schedule:
    # 15:00 UTC (~8am PT / 11am ET) daily
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Publish next queued post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python scripts/post_daily.py

      - name: Commit updated queue state
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.csv
          git diff --cached --quiet || git commit -m "Mark post as published [skip ci]"
          git push
