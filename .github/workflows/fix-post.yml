name: Fix a published post (manual)

# Deletes an already-published row's live Instagram media and republishes
# it from the row's current image_path -- for when a post needs a real
# correction (e.g. source media was regenerated) after it already went
# live. Not part of daily automation; run manually with the row id to fix.
on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Queue row id to fix (e.g. 001)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      # Deploy Pages first so the (already-committed) corrected media file
      # is live before the Graph API is asked to fetch it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Delete old media + publish replacement
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          ROW_ID: ${{ github.event.inputs.row_id }}
        run: python scripts/fix_post.py

      - name: Commit updated queue state
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.csv
          git diff --cached --quiet || git commit -m "Fix post ${{ github.event.inputs.row_id }}: republish with corrected media [skip ci]"
          git pull --rebase
          git push
