name: Publish a draft post (manual)

# Publishes a queue row regardless of its status/scheduled_date -- for
# rows staged with status=draft (never picked up by daily automation)
# that have been reviewed and approved for posting.
on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Queue row id to publish (e.g. 039)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          ROW_ID: ${{ github.event.inputs.row_id }}
        run: python scripts/publish_post.py

      - name: Commit published state
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/queue.csv
          git diff --cached --quiet || git commit -m "Publish draft post ${{ github.event.inputs.row_id }} [skip ci]"
          git pull --rebase
          git push
