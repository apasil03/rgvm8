name: Reply to Instagram comments

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Reply to safe comment categories
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: python scripts/reply_comments.py

      - name: Commit updated state
        run: |
          git config user.name "rgvm8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/replied_state.json content/needs_review.json
          git diff --cached --quiet || git commit -m "Update comment reply state [skip ci]"
          git push
