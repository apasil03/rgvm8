name: Publish assets to GitHub Pages (manual)

# Manual-only. daily-post.yml deploys Pages itself inline (in the same
# job, before calling the Graph API) so it can guarantee the image it's
# about to publish is actually live first. Also triggering a deploy here
# on every push would share the same "pages" concurrency group and could
# cancel that in-flight deploy out from under it. Run this by hand if you
# just want to preview assets/ without waiting for the next daily post.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
